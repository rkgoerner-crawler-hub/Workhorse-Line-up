name: Refresh player data

# Rebuilds data/shared.json (projections, injuries, stats, kickoff times) on a schedule.
# GitHub runs scheduled jobs in UTC and they can start a few minutes late.
on:
  schedule:
    - cron: "17 10,16,22 * * *"   # every day: about 6 AM, noon and 6 PM Eastern
    - cron: "41 15 * * 0"         # Sunday about 11:40 AM Eastern, after inactives for the 1 PM games
    - cron: "56 18 * * 0"         # Sunday about 2:55 PM Eastern, before the late games
    - cron: "52 22 * * 0,1,4"     # Sun/Mon/Thu about 6:50 PM Eastern, before night games
  workflow_dispatch: {}           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build shared player data
        run: python3 -I tools/build_shared.py --out data/shared.json --work "$RUNNER_TEMP/whl"
      - name: Save it to the site
        run: |
          git config user.name "workhorse-bot"
          git config user.email "workhorse-bot@users.noreply.github.com"
          git add data/shared.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh player data"
            git push
          fi
